name: Sync WALLET.md to totalmarkdown/wallet.md

on:
  push:
    branches:
      - main
    paths:
      - 'specs/economic/WALLET.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-md-specs
        uses: actions/checkout@v4

      - name: Checkout standalone repo
        uses: actions/checkout@v4
        with:
          repository: totalmarkdown/wallet.md
          token: ${{ secrets.SYNC_PAT }}
          path: standalone

      - name: Copy spec file
        run: cp specs/economic/WALLET.md standalone/WALLET.md

      - name: Push if changed
        run: |
          cd standalone
          git config user.name "TotalMarkdown Sync"
          git config user.email "sync@totalmarkdown.ai"
          git add WALLET.md
          git diff --cached --quiet || {
            git commit -m "sync: update WALLET.md from agent-md-specs"
            git push
          }
