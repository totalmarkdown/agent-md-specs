name: Sync TEAM.md to totalmarkdown/team.md

on:
  push:
    branches:
      - main
    paths:
      - 'specs/coordination/TEAM.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-md-specs
        uses: actions/checkout@v4

      - name: Checkout standalone repo
        uses: actions/checkout@v4
        with:
          repository: totalmarkdown/team.md
          token: ${{ secrets.SYNC_PAT }}
          path: standalone

      - name: Copy spec file
        run: cp specs/coordination/TEAM.md standalone/TEAM.md

      - name: Push if changed
        run: |
          cd standalone
          git config user.name "TotalMarkdown Sync"
          git config user.email "sync@totalmarkdown.ai"
          git add TEAM.md
          git diff --cached --quiet || {
            git commit -m "sync: update TEAM.md from agent-md-specs"
            git push
          }
