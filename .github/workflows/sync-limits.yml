name: Sync LIMITS.md to totalmarkdown/limits.md

on:
  push:
    branches:
      - main
    paths:
      - 'specs/governance/LIMITS.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-md-specs
        uses: actions/checkout@v4

      - name: Push spec file to standalone repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        with:
          source-directory: 'specs/governance'
          destination-github-username: 'totalmarkdown'
          destination-repository-name: 'limits.md'
          user-email: 'sync@totalmarkdown.ai'
          user-name: 'TotalMarkdown Sync'
          commit-message: 'sync: update LIMITS.md from agent-md-specs'
          target-branch: 'main'
          target-directory: '.'
