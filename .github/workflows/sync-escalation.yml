name: Sync ESCALATION.md to totalmarkdown/escalation.md

on:
  push:
    branches:
      - main
    paths:
      - 'specs/governance/ESCALATION.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-md-specs
        uses: actions/checkout@v4

      - name: Checkout standalone repo
        uses: actions/checkout@v4
        with:
          repository: totalmarkdown/escalation.md
          token: ${{ secrets.SYNC_PAT }}
          path: standalone

      - name: Copy spec file
        run: cp specs/governance/ESCALATION.md standalone/ESCALATION.md

      - name: Push if changed
        run: |
          cd standalone
          git config user.name "TotalMarkdown Sync"
          git config user.email "sync@totalmarkdown.ai"
          git add ESCALATION.md
          git diff --cached --quiet || {
            git commit -m "sync: update ESCALATION.md from agent-md-specs"
            git push
          }
