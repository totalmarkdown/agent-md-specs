name: Check Internal Links

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check internal Markdown links
        run: |
          set -u
          echo "=== Checking internal .md links across the repo ==="

          # Write the check as a Python script so that relative paths
          # (including ..) resolve correctly and we catch all .md files,
          # not just a hardcoded list.
          python3 <<'PY'
          import os
          import re
          import sys

          errors = []
          md_re = re.compile(r'\[[^\]]*\]\(([^)]+\.md)(?:#[^)]*)?\)')

          for root, _dirs, files in os.walk('.'):
              if any(seg in root for seg in ('/.git', '/archive', '/node_modules')):
                  continue
              for name in files:
                  if not name.endswith('.md'):
                      continue
                  path = os.path.join(root, name)
                  with open(path, encoding='utf-8', errors='replace') as fh:
                      content = fh.read()

                  # Skip fenced code blocks so example snippets aren't checked.
                  lines = []
                  in_fence = False
                  for line in content.splitlines():
                      stripped = line.strip()
                      if stripped.startswith('```'):
                          in_fence = not in_fence
                          continue
                      if not in_fence:
                          lines.append(line)
                  text = '\n'.join(lines)

                  for target in md_re.findall(text):
                      if target.startswith(('http://', 'https://', 'mailto:')):
                          continue
                      resolved = os.path.normpath(
                          os.path.join(os.path.dirname(path), target)
                      )
                      if not os.path.isfile(resolved):
                          errors.append(f'{path} -> {target} (resolves to {resolved})')

          if errors:
              print('BROKEN LINKS FOUND:')
              for err in errors:
                  print(f'  {err}')
              sys.exit(1)
          else:
              print('All internal .md links resolve. ✓')
          PY
