name: Validate Specs

on:
  push:
    paths:
      - 'specs/**'
      - 'examples/**'
      - 'schemas/**'
      - 'templates/**'
      - 'tools/**'
      - 'tests/**'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/validate-specs.yml'
  pull_request:
    paths:
      - 'specs/**'
      - 'examples/**'
      - 'schemas/**'
      - 'templates/**'
      - 'tools/**'
      - 'tests/**'
      - 'CONTRIBUTING.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/validate-specs.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-md-specs
        uses: actions/checkout@v4

      - name: Checkout validator
        uses: actions/checkout@v4
        with:
          repository: totalmarkdown/agent-md-validator
          path: validator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator
        run: |
          cd validator
          pip install -e .

      - name: Validate all specs
        run: |
          echo "=== Validating specs ==="
          agent-md-validate specs/

      - name: Validate all starter templates
        run: |
          echo "=== Validating templates ==="
          # Templates keep the .template.md suffix while declaring the bare
          # spec_name of the spec they instantiate, so one filename-mismatch
          # warning per template is expected. Errors are not.
          agent-md-validate templates/

      - name: Validate all example bundles
        run: |
          for bundle in examples/*/; do
            echo "=== $(basename $bundle) ==="
            agent-md-validate "$bundle"
          done

      - name: Validate frontmatter and per-spec schemas
        run: |
          pip install jsonschema pyyaml
          python3 tools/validate_corpus.py

      - name: Report Stable-gate (Level 3) readiness
        run: |
          python3 tools/validate_corpus.py --stable-gate | tail -n 3

      - name: Corpus validator regression tests
        run: |
          pip install pytest
          python3 -m pytest tests/ -q

      - name: Count verification
        run: |
          total=$(find specs/ -name '*.md' -not -name 'README.md' -type f | wc -l)
          core=$(grep -rl '^tier: core' specs/ | wc -l)
          extended=$(grep -rl '^tier: extended' specs/ | wc -l)
          templates=$(find templates/ -name '*.template.md' -type f | wc -l)
          echo "Total: $total | Core: $core | Extended: $extended | Templates: $templates"
